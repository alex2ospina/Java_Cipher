spring.application.name=connection-credential-crypto
server.error.include-message=never
spring.datasource.url=jdbc:sqlite:${CREDENTIALS_DB_PATH:./credentials.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000
spring.sql.init.mode=always

credentials.api.username=${CREDENTIALS_API_USERNAME:}
credentials.api.password=${CREDENTIALS_API_PASSWORD:}
credentials.jwt.secret-base64=${CREDENTIALS_JWT_SECRET_BASE64:}
credentials.jwt.issuer=${CREDENTIALS_JWT_ISSUER:connection-credential-crypto}
credentials.jwt.expiration-seconds=${CREDENTIALS_JWT_EXPIRATION_SECONDS:900}
credentials.crypto.aes-key-base64=${CREDENTIALS_AES_KEY_BASE64:}
credentials.crypto.ml-kem-public-key-base64=${CREDENTIALS_MLKEM_PUBLIC_KEY_BASE64:}
credentials.crypto.ml-kem-private-key-base64=${CREDENTIALS_MLKEM_PRIVATE_KEY_BASE64:}
